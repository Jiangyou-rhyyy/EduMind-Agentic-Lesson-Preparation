[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edumind-agentic-lesson-preparation"
version = "0.1.0"
description = "A compact LLM- and knowledge-augmented lesson preparation reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EduMind Contributors" }]
dependencies = []

[project.scripts]
edumind-demo = "edumind.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

